name: pytest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install claim-0 package
        working-directory: -Py2APK-main
        run: python -m pip install -e ".[dev]"
      - name: SDK-free pytest
        working-directory: -Py2APK-main
        run: python -m pytest -q
